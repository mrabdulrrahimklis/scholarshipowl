name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:push
      - run: npm run seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend-unit:
    name: Frontend — lint, Vitest unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    name: Frontend — Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend deps + seed DB
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
        run: |
          npm install
          npm run db:push
          npm run seed

      - name: Start API (:4000)
        working-directory: backend
        env:
          DATABASE_URL: file:./dev.db
          CORS_ORIGIN: http://localhost:3000,http://localhost:3100
          PORT: "4000"
        run: |
          nohup npm run start > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{"query":"{health}"}' && break; sleep 1; done

      - name: Frontend deps + browser
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
